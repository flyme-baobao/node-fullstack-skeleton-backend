name: Build -> Push -> Deploy

# 手动触发（GitHub Actions 不支持 GitLab 的模板/除错，只有手动 btn 可点）
on:
  workflow_dispatch:

# ===================== 环境变量总览 =====================
# 一、本文件 env: 段（非敏感，写死或自动生成）
#   IMAGE_NAME        阿里云 ACR 公网镜像仓库地址（个人版；build/CI 与 ECS pull 均用，公网）
#   IMAGE_NAME_VPC    ACR 内网（-vpc）地址——个人版不支持同账号 ECS 内网拉取（官方 2024-09-04 后），暂未启用
#   IMAGE_TAG         镜像 tag，自动取平台 commit（github.sha）
#   COMPOSE_WAIT_TIMEOUT  compose 部署健康等待超时（env 兜底 60，无需配 secrets）
# 二、平台 Secrets 中配置的变量（CI 中经 ${{ secrets.XXX }} 引用）
#   ＊配置入口：Settings → Secrets and variables → Actions（与 Gitee 仅入口不同）
#   ├─ ACR 登录（必填）    REGISTRY_USER / REGISTRY_PASSWORD
#   ├─ 生产 SSH（必填）    DEPLOY_SSH / DEPLOY_PATH / DEPLOY_SERVER_HOST
#   ├─ DB/Redis（必填）    DB_USER / DB_PASSWORD / DB_NAME / REDIS_PASSWORD
#   └─ 运行期/compose插值（可选，缺省用默认值，无需配置）
#                         SERVER_PORT(3000) / NODE_ENV(production) / TZ(Asia/Shanghai)
#                         DB_POOL_MAX(10) / DB_IDLE_TIMEOUT_MS(30000) / DB_CONNECTION_TIMEOUT_MS(5000)
# ===========================================================

env:
  # 阿里云 ACR 公网镜像仓库地址（个人IP 版；公网全名，CI build/ECS pull 均用）
  IMAGE_NAME: "crpi-1vp5deeta128cxtu.cn-beijing.personal.cr.aliyuncs.com/my-app-flyme/node-fullstack-skeleton"
  # 阿里云 ACR 内网（-vpc）地址，仅供企业版/老实例在同 VPC 免流使用；
  # 个人IP 版不支持内网拉取 → 暂未启用（官方 2024-09-04 后限制）
  IMAGE_NAME_VPC: "crpi-1vp5deeta128cxtu.cn-beijing.personal.cr.aliyuncs.com/my-app-flyme/node-fullstack-skeleton-vpc"
  IMAGE_TAG: ${{ github.sha }}
  # Compose 部署超时等待，保障服务健康就绪
  COMPOSE_WAIT_TIMEOUT: "60"

jobs:
  # ============================================================
  # job 1 —— 构建并推送镜像（在 CI Runner 虚拟机里）
  #   build + push 到 ACR，不触碰生产服务器（SSH 全部留给 job2）
  # ============================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .

      # 推镜像到阿里云 ACR（在 Runner 上完成，无需触碰生产 SSH）
      - name: Push image to ACR
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          echo ${REGISTRY_PASSWORD} | docker login ${IMAGE_NAME%%/*} -u ${REGISTRY_USER} --password-stdin
          docker push ${IMAGE_NAME}:${IMAGE_TAG}

  # ============================================================
  # job 2 —— 部署（全程在主机上，通过 ssh 执行）
  # 依赖 job1.build（镜像已推送 ACR）成功
  # 主机上：登录 ACR → pull 镜像 → compose up
