<div class="fixed inset-0 z-50 flex h-screen w-screen items-center justify-center bg-gray-900/40 p-4 backdrop-blur-sm"
    data-confirm-overlay>
    <div class="card w-full max-w-sm p-6 text-center">
        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full ring-1" data-confirm-badge>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" data-confirm-icon />
            </svg>
        </div>
        <h3 class="mt-4 text-center text-lg font-semibold text-gray-900" data-confirm-title></h3>
        <p class="mt-2 text-center text-sm leading-relaxed text-gray-500" data-confirm-msg></p>
        <div class="mt-6 flex items-center justify-end gap-3">
            <button type="button" data-action="cancel" class="btn-ghost" data-confirm-cancel>取消</button>
            <button type="button" data-action="confirm" class="btn-primary" data-confirm-ok>确认</button>
        </div>
    </div>
</div>
